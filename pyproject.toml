[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emby-cc"
version = "0.1.0"
description = "Emby Community Care - Emby 签到与保活工具"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "jiabirc6" },
]
keywords = ["emby", "checkin", "keepalive", "telegram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx>=0.27",
    "curl-cffi>=0.7",
    "pyrogram>=2.0",
    "lxml>=5.0",
    "cssselect>=1.2",
    "rich>=13.0",
    "click>=8.1",
    "pydantic>=2.0",
    "ddddocr>=1.4",
    "tgcrypto>=1.2",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
ai = ["openai>=1.0"]
all = ["emby-cc[browser,ai]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
emby-cc = "emby_cc.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/emby_cc"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
